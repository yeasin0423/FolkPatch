name: Setup Build Environment
description: Install all build dependencies (Java, Android SDK, Gradle, Rust toolchain)

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    # NOTE: android-actions/setup-android@v3 was removed — its default
    # `sdkmanager tools` fails (the "tools" package no longer exists).
    # Install exactly what build.gradle.kts / app/build.gradle.kts need,
    # skipping anything the runner image already ships.
    - name: Install Android SDK packages
      shell: bash
      run: |
        set -euo pipefail
        export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
        yes | sdkmanager --licenses > /dev/null || true
        echo "=== Preinstalled platforms ==="
        ls "$ANDROID_HOME/platforms" || true
        echo "=== Preinstalled build-tools ==="
        ls "$ANDROID_HOME/build-tools" || true
        install_pkg() { # $1 = sdkmanager path, $2 = local dir
          if [ -e "$ANDROID_HOME/$2" ]; then
            echo "present, skipping: $1"
          else
            sdkmanager "$1"
          fi
        }
        install_pkg "platform-tools" "platform-tools"
        install_pkg "build-tools;36.1.0" "build-tools/36.1.0"
        install_pkg "ndk;30.0.15729638" "ndk/30.0.15729638"
        # NOTE: the SDK repo carries no CMake >= 3.28, but the project needs
        # 3.28.0+ (AGP version + cmake_minimum_required). A Kitware CMake is
        # installed below and wired via the documented `cmake.dir` property.
        if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
          sdkmanager "platforms;android-37" || sdkmanager --channel=1 "platforms;android-37"
        else
          echo "present, skipping: platforms;android-37"
        fi

    - uses: actions/cache@v4
      with:
        path: ~/cmake
        key: ${{ runner.os }}-cmake-3.28.3
        restore-keys: ${{ runner.os }}-cmake-

    - name: Install CMake 3.28.3 (Kitware)
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -x "$HOME/cmake/bin/cmake" ]; then
          curl -sfL -o /tmp/cmake.tgz \
            "https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-linux-x86_64.tar.gz"
          mkdir -p "$HOME/cmake"
          tar -xzf /tmp/cmake.tgz -C "$HOME/cmake" --strip-components=1
          rm -f /tmp/cmake.tgz
        fi
        "$HOME/cmake/bin/cmake" --version
        mkdir -p ~/.gradle
        if ! grep -q "^cmake.dir=" ~/.gradle/gradle.properties 2>/dev/null; then
          echo "cmake.dir=$HOME/cmake" >> ~/.gradle/gradle.properties
        fi

    - uses: gradle/actions/setup-gradle@v3

    # NOTE: actions-rs/toolchain@v1 is archived — use the maintained toolchain action.
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/bin/cargo-ndk
        key: ${{ runner.os }}-cargo-ndk-v1
        restore-keys: ${{ runner.os }}-cargo-ndk-

    - name: Install cargo-ndk
      shell: bash
      run: |
        if ! command -v cargo-ndk >/dev/null 2>&1; then
          cargo install cargo-ndk
        fi

    - name: Grant execute permission
      shell: bash
      run: chmod +x gradlew

    - uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-gradle-
